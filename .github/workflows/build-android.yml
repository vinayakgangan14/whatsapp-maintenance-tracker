name: Build Android AAB and APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Production AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Release Keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v -keystore keystore.jks -alias maintenancetracker -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Maintenance Tracker, OU=Engineering, O=Apex, L=Plant, ST=State, C=IN"

      - name: Grant Execute Permissions for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Google Play Store Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Release and Debug APKs
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-Store-Bundle-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APKs-Release-and-Debug
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
