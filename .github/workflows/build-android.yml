name: Build Android AAB and APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Production AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Release Keystore
        working-directory: android/app
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias maintenancetracker -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Maintenance Tracker, OU=Engineering, O=Apex, L=Plant, ST=State, C=IN"
          fi
          keytool -list -v -keystore keystore.jks -storepass android123


      - name: Verify Gradle Setup
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ls -la gradle/wrapper/
          ./gradlew -v

      - name: Build Google Play Store Bundle (AAB)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Release and Debug APKs
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-Store-Bundle-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APKs-Release-and-Debug
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with AAB and APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: Maintenance Tracker App v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### 🚀 Maintenance Tracker Mobile App Release
            - **Google Play Store Bundle**: `app-release.aab` (Upload this directly to Google Play Console)
            - **Direct Install APK**: `app-release.apk` (Install directly on Android phones for testing)
            - **Target SDK**: 35 (Android 15)
            - **Package**: `com.maintenancetracker.app`
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/upload_certificate.pem